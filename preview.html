<!doctype html>
<html lang="ko">

<title>Subnautica AI — 음원 확인</title>
<style>
  :root { color-scheme: dark; font: 16px/1.6 system-ui, sans-serif; background: #071b29; color: #e2f3fa; }
  body { max-width: 720px; margin: 48px auto; padding: 0 24px; }
  h1 { line-height: 1.2; color: #77d5f9; }
  p { color: #afc7d5; }
  article { margin: 18px 0; padding: 18px; border: 1px solid #255169; border-radius: 12px; background: #102b3a; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  code { font-size: 13px; font-weight: normal; color: #8acbe3; }
  audio { width: 100%; }
  a { color: #77d5f9; }
</style>
<h1>Subnautica AI</h1>
<p>선정한 7개 알림 음원을 개별 재생할 수 있습니다. 대사와 체크섬은 <a href="openpeon.json">매니페스트</a>, 원본 정보는 <a href="sources.json">출처 목록</a>에 있습니다.</p>
<article><h2>세션 시작 · <code>session.start</code></h2><audio controls preload="none" src="sounds/welcome_aboard.wav"></audio></article>
<article><h2>작업 접수 · <code>task.acknowledge</code></h2><audio controls preload="none" src="sounds/engine_powering_up.wav"></audio></article>
<article><h2>작업 완료 · <code>task.complete</code></h2><audio controls preload="none" src="sounds/blueprint_acquired.wav"></audio></article>
<article><h2>작업 오류 · <code>task.error</code></h2><audio controls preload="none" src="sounds/fire_detected.wav"></audio></article>
<article><h2>입력 필요 · <code>input.required</code></h2><audio controls preload="none" src="sounds/new_message.wav"></audio></article>
<article><h2>자원 부족 · <code>resource.limit</code></h2><audio controls preload="none" src="sounds/oxygen.wav"></audio></article>
<article><h2>연속 입력 · <code>user.spam</code></h2><audio controls preload="none" src="sounds/silent_running.wav"></audio></article>
<p>게임 음원의 권리는 원저작권자에게 있습니다. 비공식 팬 제작 팩입니다.</p>
</html>
