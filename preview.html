<h1>Subnautica PDA</h1>
<p>원작 PDA 보이스로 통일한 7개 알림 음원입니다. 대사와 체크섬은 <a href="openpeon.json">매니페스트</a>, 원본과 문장 편집 구간은 <a href="sources.json">출처 목록</a>에 있습니다.</p>
<article><h2>세션 시작 · <code>session.start</code></h2><audio controls preload="none" src="sounds/good_luck.wav"></audio></article>
<article><h2>작업 접수 · <code>task.acknowledge</code></h2><audio controls preload="none" src="sounds/integrating_data.wav"></audio></article>
<article><h2>작업 완료 · <code>task.complete</code></h2><audio controls preload="none" src="sounds/blueprint_acquired.wav"></audio></article>
<article><h2>작업 오류 · <code>task.error</code></h2><audio controls preload="none" src="sounds/cannot_build_here.wav"></audio></article>
<article><h2>입력 필요 · <code>input.required</code></h2><audio controls preload="none" src="sounds/self_scan_advised.wav"></audio></article>
<article><h2>자원 부족 · <code>resource.limit</code></h2><audio controls preload="none" src="sounds/oxygen.wav"></audio></article>
<article><h2>연속 입력 · <code>user.spam</code></h2><audio controls preload="none" src="sounds/take_a_seat.wav"></audio></article>
<p>게임 음원의 권리는 원저작권자에게 있습니다. 비공식 팬 제작 팩입니다.</p>
